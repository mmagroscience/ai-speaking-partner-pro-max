name: ai_speaking_partner
description: "AI Speaking Partner PRO MAX - face-to-face AI video calls, pronunciation coaching, IELTS mock tests and a 3-tone vocabulary bank."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  http: ^1.6.0
  image_picker: ^1.2.4
  camera: ^0.12.2
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2A0E5C"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#F7F4FF"
    theme_color: "#4C1D95"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/icon.png
    - assets/audio/ring.wav
    - assets/ota_config.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
